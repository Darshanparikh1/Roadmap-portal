<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Throughline is where customers tell us what to build next: post a feature request, upvote the ones you need, and follow the public roadmap from idea to shipped." />
    <script>
      try {
        const t = localStorage.getItem("theme");
        if (t === "dark" || (!t && matchMedia("(prefers-color-scheme: dark)").matches)) {
          document.documentElement.classList.add("dark");
        }
      } catch {}
    </script>
    <title>Throughline — Feature requests &amp; public roadmap</title>
  </head>
  <body>
    <div id="root" class="isolate"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
